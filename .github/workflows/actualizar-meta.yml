name: Actualizar datos de Meta

on:
  schedule:
    # Cada 3 horas. GitHub usa UTC; en Chile son 3 horas menos.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-meta
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos desde la Marketing API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ vars.META_AD_ACCOUNT || '372739988524670' }}
          META_START: "2026-01-01"
        run: python scripts/fetch_meta.py

      - name: Publicar los archivos actualizados
        run: |
          git config user.name "actualizador-meta"
          git config user.email "actions@github.com"
          if git diff --quiet -- meta-data.js meta-daily.js; then
            echo "Sin cambios: no se hace commit."
            exit 0
          fi
          git add meta-data.js meta-daily.js
          git commit -m "Datos de Meta al $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
