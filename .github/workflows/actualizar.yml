name: Actualizar datos (Meta + Google)

on:
  schedule:
    # Cada 4 horas, en UTC. Antes habia una guardia que solo dejaba pasar
    # las 08:00 y las 14:00 de Santiago, pero GitHub atrasa los cron hasta
    # media hora y casi ninguna corrida caia dentro de esa ventana.
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-dash
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos de Meta
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ vars.META_AD_ACCOUNT || '372739988524670' }}
          META_START: "2026-01-01"
        run: |
          if [ -z "$META_TOKEN" ]; then
            echo "::error::Falta el secret META_TOKEN. Sin el, GitHub no puede consultar la Marketing API de Meta. Se crea en Settings > Secrets and variables > Actions > New repository secret, con un token de usuario del sistema de Meta con permiso ads_read."
            exit 1
          fi
          python scripts/fetch_meta.py

      - name: Descargar datos de Google Ads
        continue-on-error: true
        env:
          # La hoja va por defecto dentro del script; el secret solo sirve
          # para apuntar a otra sin tocar el codigo.
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_START: "2026-06-30"
        run: python scripts/fetch_google.py

      - name: Publicar los archivos actualizados
        run: |
          git config user.name "actualizador-dash"
          git config user.email "actions@github.com"
          archivos=""
          for f in meta-data.js meta-daily.js google-data.js google-daily.js; do
            [ -f "$f" ] && archivos="$archivos $f"
          done
          git add -- $archivos
          if git diff --cached --quiet; then
            echo "Sin cambios: no se hace commit."
            exit 0
          fi
          git commit -m "Datos al $(TZ=America/Santiago date '+%Y-%m-%d %H:%M') (Santiago)"
          git pull --rebase --autostash
          git push
