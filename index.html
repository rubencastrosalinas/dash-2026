<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Publicidad 2026 &mdash; Meta + Google</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f4;color:#1a1a19;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:#6b6b66;font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e3e2dc;border-radius:12px;padding:16px 18px;margin-bottom:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid #e3e2dc;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.bar label{font-size:12px;color:#6b6b66}
select,input{padding:6px 9px;border:1px solid #cfcec7;border-radius:7px;font-size:13px;background:#fff;color:#1a1a19;font-family:inherit}
input[type=date]{width:145px}
.rng{font-size:12px;color:#8a8a84;margin-left:auto}
#upd{background:#eef4fb;border-color:#a9c9ea;color:#0c447c;font-weight:500}
#upd:disabled{opacity:.55;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #e3e2dc;border-radius:12px;padding:13px 15px}
.kpi .l{font-size:11px;color:#6b6b66;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:21px;font-weight:600;letter-spacing:-.3px}
.kpi .s{font-size:11px;color:#8a8a84;margin-top:2px}
.up{color:#0f6e56;font-weight:600}
.dn{color:#a32d2d;font-weight:600}
.fh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.fh h2,.fh h3{font-size:15px;font-weight:600;margin:0}
button{background:#fff;border:1px solid #cfcec7;border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;margin-left:6px;color:#1a1a19}
button:hover{background:#f0efea}
.plats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pt{display:flex;align-items:center;gap:7px;border:1px solid #dcdbd4;background:#fafaf8;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;user-select:none;color:#8a8a84;font-weight:500}
.pt.on{background:#fff;color:#1a1a19;border-color:#b9b8b1}
.pt i{width:10px;height:10px;border-radius:3px;display:inline-block;opacity:.3}
.pt.on i{opacity:1}
.pt .m{font-size:11px;color:#8a8a84;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-height:210px;overflow:auto}
.chip{display:flex;align-items:center;gap:7px;border:1px solid #dcdbd4;background:#fafaf8;border-radius:20px;padding:5px 13px 5px 10px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:#e6f1fb;border-color:#8fbbe8;color:#0c447c}
.chip.off{opacity:.35;pointer-events:none}
.chip .d{width:9px;height:9px;border-radius:50%;background:#c9c8c1;flex:none}
.chip.on .d{background:#2a78d6}
.chip .m{color:#8a8a84;font-size:11px}
.chip.on .m{color:#2a6cb5}
.bdg{font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-radius:4px;padding:1px 5px;font-weight:600}
.bdg.meta{background:#e6f1fb;color:#1257a0}
.bdg.google{background:#fdeee4;color:#a4490f}
.chip.on .bdg.meta{background:#cfe3f7}
h3{font-size:14px;font-weight:600;margin:0 0 10px;color:#3d3d3a}
.series{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.s-t{display:flex;align-items:center;gap:6px;font-size:12px;border:1px solid #dcdbd4;border-radius:7px;padding:4px 10px;cursor:pointer;user-select:none;background:#fafaf8;color:#8a8a84}
.s-t.on{background:#fff;color:#1a1a19;border-color:#b9b8b1}
.s-t i{width:11px;height:11px;border-radius:2px;display:inline-block;opacity:.3}
.s-t.on i{opacity:1}
.cw{position:relative;height:400px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-weight:600;color:#6b6b66;padding:7px 6px;border-bottom:1px solid #e3e2dc;font-size:12px;white-space:nowrap;cursor:pointer}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:7px 6px;border-bottom:1px solid #f0efea;white-space:nowrap}
tbody tr:hover{background:#faf9f6}
.good{color:#0f6e56;font-weight:600}
.bad{color:#a32d2d;font-weight:600}
.note{font-size:12px;color:#8a8a84;margin-top:10px;line-height:1.6}
.warn{font-size:12px;color:#854f0b;background:#faeeda;border-radius:7px;padding:7px 11px;margin-bottom:12px}
.err{font-size:12px;color:#8c2020;background:#fae3e3;border-radius:7px;padding:7px 11px;margin-bottom:12px}
.scroll{overflow-x:auto}
@media(max-width:640px){.kpi .v{font-size:18px}.wrap{padding:16px 12px 40px}.cw{height:320px}.rng{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>Publicidad 2026 &mdash; Meta + Google</h1>
<div class="sub" id="sub">Cargando datos&hellip;</div>

<div class="bar">
  <label for="preset">Per&iacute;odo</label>
  <select id="preset">
    <option value="7">&Uacute;ltimos 7 d&iacute;as</option>
    <option value="14">&Uacute;ltimos 14 d&iacute;as</option>
    <option value="28">&Uacute;ltimos 28 d&iacute;as</option>
    <option value="30" selected>&Uacute;ltimos 30 d&iacute;as</option>
    <option value="90">&Uacute;ltimos 90 d&iacute;as</option>
    <option value="tm">Este mes</option>
    <option value="lm">Mes pasado</option>
    <option value="ty">Todo 2026</option>
    <option value="cu">Personalizado</option>
  </select>
  <label for="f1">Desde</label><input type="date" id="f1" min="2026-01-01">
  <label for="f2">Hasta</label><input type="date" id="f2" min="2026-01-01">
  <label for="cmp">Comparar</label>
  <select id="cmp">
    <option value="none">Sin comparaci&oacute;n</option>
    <option value="prev" selected>Per&iacute;odo anterior</option>
  </select>
  <label for="mg">Margen</label><input type="number" id="mg" min="1" max="99" step="1" value="45" style="width:60px;text-align:right">
  <button id="upd" title="Vuelve a leer los datos publicados, sin cach&eacute;">Actualizar datos</button>
  <span class="rng" id="rng"></span>
</div>

<div id="msg"></div>
<div class="kpis" id="kpis"></div>

<div class="card">
  <div class="fh"><h2>Plataformas</h2><span class="rng" id="be"></span></div>
  <div class="plats" id="plats"></div>
  <div class="scroll"><table id="tplat"></table></div>
</div>

<div class="card">
  <div class="fh">
    <h2>Campa&ntilde;as</h2>
    <div><button id="all">Todas</button><button id="none">Ninguna</button><button id="top">Top 5</button></div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="card">
  <h3>Vista combinada</h3>
  <div class="series" id="series"></div>
  <div class="cw"><canvas id="cc"></canvas></div>
</div>

<div class="card">
  <h3>Ranking de campa&ntilde;as</h3>
  <div class="scroll"><table id="trank"></table></div>
</div>

<div class="card">
  <h3>Detalle</h3>
  <div class="scroll"><table id="tdet"></table></div>
  <div class="note" id="pie"></div>
</div>
</div>

<script>
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const nf=new Intl.NumberFormat("es-CL");
const clp=v=>"$"+nf.format(Math.round(v));
const COL={sp:"#2a78d6",va:"#1baf7a",ro:"#eb6834",ct:"#6250d6",cv:"#eda100"};
const PCOL={meta:"#2a78d6",google:"#eb6834"};
const PNOM={meta:"Meta Ads",google:"Google Ads"};
const SER=[{k:"sp",n:"Gasto",on:true},{k:"va",n:"Valor conv.",on:true},{k:"ro",n:"ROAS",on:true},{k:"ct",n:"CTR",on:false},{k:"cv",n:"Conversi\u00f3n",on:false}];
const FIRST="2026-01-01";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>new Date(s+"T00:00:00");
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x};
const fmt=s=>{const p=s.split("-");return parseInt(p[2],10)+" "+MES[parseInt(p[1],10)-1]};

let CAMPS=new Map(), WROWS=[], DROWS=[], WEEKS=[];
let dstart=null, LAST=null, order=[], sel=new Set(), plats=new Set(["meta","google"]);
let margin=45, sortKey="sp", chart=null, cargadas=new Set(), sellos=[];

const elP=document.getElementById("preset"),el1=document.getElementById("f1"),el2=document.getElementById("f2");
const chips=document.getElementById("chips"),msg=document.getElementById("msg"),btn=document.getElementById("upd");

async function txt(f){
  const r=await fetch(f+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(f+" no disponible");
  return r.text();
}

function sello(t){
  const m=/Ultima corrida: (\d{4}-\d\d-\d\d) (\d\d:\d\d) UTC/.exec(t);
  return m?new Date(m[1]+"T"+m[2]+":00Z"):null;
}

function absorber(p,D,L,S){
  const d0=parse(S);
  D.campaigns.forEach((n,i)=>CAMPS.set(p+":"+i,{k:p+":"+i,n:n,p:p}));
  D.rows.forEach(r=>{
    const w=D.weeks[r[0]];
    if(w)WROWS.push({w:w,k:p+":"+r[1],sp:r[2],im:r[3],cl:r[4],va:r[5],pu:r[6]});
  });
  L.forEach(r=>{
    DROWS.push({d:iso(addD(d0,r[0])),k:p+":"+r[1],sp:r[2],im:r[3],cl:r[4],va:r[5],pu:r[6]});
  });
  if(!dstart||d0<dstart)dstart=d0;
  cargadas.add(p);
}

async function load(){
  CAMPS=new Map();WROWS=[];DROWS=[];cargadas=new Set();dstart=null;sellos=[];
  const faltan=[];

  const [ma,mb]=await Promise.all([txt("meta-data.js"),txt("meta-daily.js")]);
  const m=new Function(ma+"\n"+mb+"\nreturn{D:DATA,L:DAILY,S:DAILY_START};")();
  absorber("meta",m.D,m.L,m.S);
  sellos.push(sello(ma));

  try{
    const [ga,gb]=await Promise.all([txt("google-data.js"),txt("google-daily.js")]);
    const g=new Function(ga+"\n"+gb+"\nreturn{D:GOOGLE_DATA,L:GOOGLE_DAILY,S:GOOGLE_DAILY_START};")();
    absorber("google",g.D,g.L,g.S);
    sellos.push(sello(ga));
  }catch(e){faltan.push("google")}

  WEEKS=[...new Set(WROWS.map(r=>r.w))].sort();
  LAST=WEEKS.length?WEEKS[WEEKS.length-1]:FIRST;
  DROWS.forEach(r=>{if(r.d>LAST)LAST=r.d});
  el1.max=LAST;el2.max=LAST;

  const f=sellos.filter(Boolean).sort((a,b)=>b-a)[0];
  const quien=[...cargadas].map(p=>PNOM[p]).join(" + ");
  document.getElementById("sub").innerHTML=quien+" &middot; datos hasta el "+fmt(LAST)+" de 2026 &middot; valores en CLP"+
    (f?" &middot; actualizado el "+f.toLocaleDateString("es-CL")+" a las "+f.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}):"");
  return faltan;
}

function buildPlats(){
  const box=document.getElementById("plats");
  box.innerHTML="";
  ["meta","google"].forEach(p=>{
    if(!cargadas.has(p))return;
    let sp=0;
    DROWS.forEach(r=>{if(CAMPS.get(r.k).p===p)sp+=r.sp});
    const d=document.createElement("div");
    d.className="pt"+(plats.has(p)?" on":"");
    d.innerHTML='<i style="background:'+PCOL[p]+'"></i>'+PNOM[p]+' <span class="m">'+clp(sp)+'</span>';
    d.onclick=()=>{
      plats.has(p)?plats.delete(p):plats.add(p);
      if(!plats.size)plats.add(p);
      buildPlats();buildChips();render();
    };
    box.appendChild(d);
  });
}

const activo=k=>sel.has(k)&&plats.has(CAMPS.get(k).p);

function buildChips(){
  const tot=new Map();
  CAMPS.forEach(c=>tot.set(c.k,{k:c.k,n:c.n,p:c.p,sp:0}));
  DROWS.forEach(r=>{if(tot.has(r.k))tot.get(r.k).sp+=r.sp});
  WROWS.forEach(r=>{if(tot.has(r.k)&&!DROWS.length)tot.get(r.k).sp+=r.sp});
  order=[...tot.values()].sort((a,b)=>b.sp-a.sp);
  if(!sel.size)sel=new Set(order.map(t=>t.k));
  order.forEach(t=>{if(!sel.has(t.k)&&!CAMPS.has(t.k))sel.add(t.k)});
  chips.innerHTML="";
  order.forEach(t=>{
    const d=document.createElement("div");
    d.className="chip"+(sel.has(t.k)?" on":"")+(plats.has(t.p)?"":" off");
    d.dataset.k=t.k;
    d.innerHTML='<span class="d"></span><span class="bdg '+t.p+'">'+(t.p==="meta"?"M":"G")+'</span><span>'+t.n+'</span><span class="m">'+clp(t.sp)+'</span>';
    d.onclick=()=>{sel.has(t.k)?(sel.delete(t.k),d.classList.remove("on")):(sel.add(t.k),d.classList.add("on"));render()};
    chips.appendChild(d);
  });
}
function setSel(ks){sel=new Set(ks);[...chips.children].forEach(c=>c.classList.toggle("on",sel.has(c.dataset.k)));render()}
document.getElementById("all").onclick=()=>setSel(order.map(t=>t.k));
document.getElementById("none").onclick=()=>setSel([]);
document.getElementById("top").onclick=()=>setSel(order.filter(t=>plats.has(t.p)).slice(0,5).map(t=>t.k));

const sbox=document.getElementById("series");
SER.forEach(s=>{
  const d=document.createElement("div");
  d.className="s-t"+(s.on?" on":"");
  d.innerHTML='<i style="background:'+COL[s.k]+'"></i>'+s.n;
  d.onclick=()=>{s.on=!s.on;d.classList.toggle("on",s.on);render()};
  sbox.appendChild(d);
});
function on(k){return SER.find(s=>s.k===k).on}

function applyPreset(){
  const v=elP.value, end=parse(LAST);
  let a,b=end;
  if(v==="cu")return render();
  if(v==="tm"){a=parse(LAST.slice(0,7)+"-01")}
  else if(v==="lm"){const p=parse(LAST.slice(0,7)+"-01");b=addD(p,-1);a=parse(iso(b).slice(0,7)+"-01")}
  else if(v==="ty"){a=parse(FIRST)}
  else{a=addD(end,-(parseInt(v,10)-1))}
  if(a<parse(FIRST))a=parse(FIRST);
  el1.value=iso(a);el2.value=iso(b);render();
}
elP.onchange=applyPreset;
el1.onchange=el2.onchange=()=>{elP.value="cu";render()};
document.getElementById("cmp").onchange=()=>render();
document.getElementById("mg").oninput=e=>{const v=+e.target.value;if(v>0&&v<100){margin=v;render()}};

btn.onclick=async()=>{
  btn.disabled=true;const t=btn.textContent;btn.textContent="Actualizando\u2026";
  try{
    const faltan=await load();buildPlats();buildChips();applyPreset();
    avisos(faltan);btn.textContent="Datos al d\u00eda";
    setTimeout(()=>{btn.textContent=t;btn.disabled=false},1800);
  }catch(e){
    msg.innerHTML='<div class="err">No se pudieron actualizar los datos: '+e.message+'</div>';
    btn.textContent=t;btn.disabled=false;
  }
};

const vacio=()=>({sp:0,va:0,im:0,cl:0,pu:0});
const acum=(o,r)=>{o.sp+=r.sp;o.im+=r.im;o.cl+=r.cl;o.va+=r.va;o.pu+=r.pu};

function aggDaily(a,b){
  const ia=iso(a), ib=iso(b);
  const buckets=new Map(), camps=new Map(), porPlat=new Map();
  for(let d=new Date(a);d<=b;d=addD(d,1))buckets.set(iso(d),Object.assign({k:iso(d)},vacio()));
  DROWS.forEach(r=>{
    if(r.d<ia||r.d>ib||!activo(r.k))return;
    const cubo=buckets.get(r.d);
    if(!cubo)return;   // defensa: un dia sin casilla no debe tumbar el tablero
    acum(cubo,r);
    if(!camps.has(r.k))camps.set(r.k,Object.assign({k:r.k},vacio()));
    acum(camps.get(r.k),r);
    const p=CAMPS.get(r.k).p;
    if(!porPlat.has(p))porPlat.set(p,Object.assign({p:p},vacio()));
    acum(porPlat.get(p),r);
  });
  return {b:[...buckets.values()],c:[...camps.values()],pl:porPlat,unit:"d\u00eda"};
}
function aggWeekly(a,b){
  const ia=iso(a), ib=iso(b);
  const usar=WEEKS.filter(w=>w>=ia&&w<=ib);
  const buckets=new Map(usar.map(w=>[w,Object.assign({k:w},vacio())]));
  const camps=new Map(), porPlat=new Map();
  WROWS.forEach(r=>{
    if(!buckets.has(r.w)||!activo(r.k))return;
    acum(buckets.get(r.w),r);
    if(!camps.has(r.k))camps.set(r.k,Object.assign({k:r.k},vacio()));
    acum(camps.get(r.k),r);
    const p=CAMPS.get(r.k).p;
    if(!porPlat.has(p))porPlat.set(p,Object.assign({p:p},vacio()));
    acum(porPlat.get(p),r);
  });
  return {b:[...buckets.values()],c:[...camps.values()],pl:porPlat,unit:"semana"};
}
const agg=(a,b)=>a>=dstart?aggDaily(a,b):aggWeekly(a,b);
const sum=o=>o.b.reduce((x,y)=>({sp:x.sp+y.sp,va:x.va+y.va,im:x.im+y.im,cl:x.cl+y.cl,pu:x.pu+y.pu}),vacio());

function delta(now,was){
  if(!was||!isFinite(was)||was===0)return "";
  const p=(now-was)/Math.abs(was)*100;
  if(!isFinite(p))return "";
  return ' <span class="'+(p>=0?"up":"dn")+'">'+(p>=0?"+":"")+p.toFixed(0)+'%</span>';
}
function kpi(l,v,s,cls){return '<div class="kpi"><div class="l">'+l+'</div><div class="v'+(cls?" "+cls:"")+'">'+v+'</div><div class="s">'+s+'</div></div>'}

function avisos(faltan){
  let h="";
  if(faltan&&faltan.indexOf("google")>=0)
    h+='<div class="warn">Google Ads todav\u00eda no publica datos: falta que el script de la cuenta haga su primera corrida. Mientras tanto el tablero muestra solo Meta.</div>';
  msg.innerHTML=h;
}

function render(){
  if(!CAMPS.size)return;
  let a=parse(el1.value||FIRST), b=parse(el2.value||LAST);
  if(a>b){const t=a;a=b;b=t}
  const days=Math.round((b-a)/864e5)+1;
  const cur=agg(a,b), T=sum(cur);
  document.getElementById("rng").textContent=fmt(iso(a))+" \u2013 "+fmt(iso(b))+" \u00b7 "+days+" d\u00edas \u00b7 por "+cur.unit;

  let P=null;
  if(document.getElementById("cmp").value==="prev"){
    const pb=addD(a,-1), pa=addD(pb,-(days-1));
    if(pa>=parse(FIRST))P=sum(agg(pa,pb));
  }
  const be=100/margin, contrib=T.va*margin/100-T.sp;
  const roas=T.sp?T.va/T.sp:0, cvr=T.cl?T.pu/T.cl*100:0, ctr=T.im?T.cl/T.im*100:0;
  document.getElementById("be").textContent="ROAS de equilibrio "+be.toFixed(2)+"x";
  document.getElementById("kpis").innerHTML=
    kpi("Inversi\u00f3n total",clp(T.sp),P?"antes "+clp(P.sp)+delta(T.sp,P.sp):days+" d\u00edas")+
    kpi("Valor conv.",clp(T.va),P?"antes "+clp(P.va)+delta(T.va,P.va):T.pu+" compras")+
    kpi("ROAS combinado",roas.toFixed(2)+"x",P&&P.sp?"antes "+(P.va/P.sp).toFixed(2)+"x"+delta(roas,P.va/P.sp):"equilibrio "+be.toFixed(2)+"x",roas>=be?"good":"bad")+
    kpi("Margen tras ads",clp(contrib),"con "+margin+"% de margen",contrib>=0?"good":"bad")+
    kpi("Compras",T.pu,P?"antes "+P.pu+delta(T.pu,P.pu):"\u2014")+
    kpi("Conversi\u00f3n",cvr.toFixed(3)+"%",P&&P.cl?"antes "+(P.pu/P.cl*100).toFixed(3)+"%"+delta(cvr,P.pu/P.cl*100):"compras / clics")+
    kpi("CPA",T.pu?clp(T.sp/T.pu):"\u2014",P&&P.pu?"antes "+clp(P.sp/P.pu)+delta(P.sp/P.pu,T.sp/T.pu):"costo por compra")+
    kpi("Ticket prom.",T.pu?clp(T.va/T.pu):"\u2014","valor / compras")+
    kpi("CTR",ctr.toFixed(2)+"%",P&&P.im?"antes "+(P.cl/P.im*100).toFixed(2)+"%"+delta(ctr,P.cl/P.im*100):nf.format(T.cl)+" clics")+
    kpi("CPC",T.cl?clp(T.sp/T.cl):"\u2014",P&&P.cl?"antes "+clp(P.sp/P.cl)+delta(P.sp/P.cl,T.sp/T.cl):"costo por clic");

  let ph='<thead><tr><th>Plataforma</th><th>Inversi\u00f3n</th><th>Part.</th><th>Valor conv.</th><th>ROAS</th><th>Compras</th><th>CPA</th><th>Ticket</th><th>Margen tras ads</th></tr></thead><tbody>';
  const pls=[...cur.pl.values()].sort((x,y)=>y.sp-x.sp);
  pls.forEach(x=>{
    const r=x.sp?x.va/x.sp:0, mg=x.va*margin/100-x.sp;
    ph+='<tr><td><span class="bdg '+x.p+'">'+(x.p==="meta"?"M":"G")+'</span> '+PNOM[x.p]+'</td>'+
        '<td>'+clp(x.sp)+'</td><td>'+(T.sp?(x.sp/T.sp*100).toFixed(0):0)+'%</td><td>'+clp(x.va)+'</td>'+
        '<td class="'+(r>=be?"good":"bad")+'">'+r.toFixed(2)+'x</td><td>'+x.pu+'</td>'+
        '<td>'+(x.pu?clp(x.sp/x.pu):"\u2014")+'</td><td>'+(x.pu?clp(x.va/x.pu):"\u2014")+'</td>'+
        '<td class="'+(mg>=0?"good":"bad")+'">'+clp(mg)+'</td></tr>';
  });
  if(!pls.length)ph+='<tr><td colspan="9" style="text-align:center;color:#8a8a84;padding:20px">Sin datos en este rango</td></tr>';
  document.getElementById("tplat").innerHTML=ph+'</tbody>';

  const lab=cur.b.map(x=>fmt(x.k));
  const ds=[];
  if(on("sp"))ds.push({type:"bar",label:"Gasto",yAxisID:"y",data:cur.b.map(x=>x.sp),backgroundColor:COL.sp,borderRadius:3,maxBarThickness:12,order:5});
  if(on("va"))ds.push({type:"bar",label:"Valor conv.",yAxisID:"y",data:cur.b.map(x=>x.va),backgroundColor:COL.va,borderRadius:3,maxBarThickness:12,order:5});
  if(on("ro")){
    ds.push({type:"line",label:"ROAS",yAxisID:"y1",data:cur.b.map(x=>x.sp?+(x.va/x.sp).toFixed(2):null),borderColor:COL.ro,backgroundColor:COL.ro,borderWidth:2,tension:.25,pointRadius:days>45?0:3,fill:false,spanGaps:true,order:1});
    ds.push({type:"line",label:"Equilibrio",yAxisID:"y1",data:cur.b.map(()=>+be.toFixed(2)),borderColor:"#b9b8b1",borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false,order:2});
  }
  if(on("ct"))ds.push({type:"line",label:"CTR",yAxisID:"y2",data:cur.b.map(x=>x.im?+(x.cl/x.im*100).toFixed(2):null),borderColor:COL.ct,borderWidth:2,borderDash:[6,3],tension:.25,pointRadius:days>45?0:3,fill:false,spanGaps:true,order:1});
  if(on("cv"))ds.push({type:"line",label:"Conversi\u00f3n",yAxisID:"y3",data:cur.b.map(x=>x.cl?+(x.pu/x.cl*100).toFixed(3):null),borderColor:COL.cv,borderWidth:2,borderDash:[2,2],tension:.25,pointRadius:days>45?0:3,fill:false,spanGaps:true,order:1});

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById("cc"),{data:{labels:lab,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:true,position:"bottom",labels:{usePointStyle:true,boxWidth:8,font:{size:11},color:"#6b6b66"}},
      tooltip:{callbacks:{label:x=>{const l=x.dataset.label,v=x.parsed.y;
        if(l==="ROAS"||l==="Equilibrio")return l+": "+v.toFixed(2)+"x";
        if(l==="CTR")return "CTR: "+v.toFixed(2)+"%";
        if(l==="Conversi\u00f3n")return "Conversi\u00f3n: "+v.toFixed(3)+"%";
        return l+": "+clp(v)}}}},
    scales:{
      x:{grid:{display:false},ticks:{font:{size:10},color:"#8a8a84",maxRotation:60,autoSkip:true,maxTicksLimit:16}},
      y:{position:"left",display:on("sp")||on("va"),grid:{color:"#ecece6"},border:{display:false},ticks:{font:{size:10},color:"#8a8a84",callback:v=>"$"+nf.format(Math.round(v/1000))+"K"}},
      y1:{position:"right",display:on("ro"),beginAtZero:true,grid:{display:false},border:{display:false},ticks:{font:{size:10},color:COL.ro,callback:v=>v.toFixed(1)+"x"}},
      y2:{position:"right",display:on("ct"),beginAtZero:true,grid:{display:false},border:{display:false},ticks:{font:{size:10},color:COL.ct,callback:v=>v.toFixed(1)+"%"}},
      y3:{position:"right",display:on("cv"),beginAtZero:true,grid:{display:false},border:{display:false},ticks:{font:{size:10},color:COL.cv,callback:v=>v.toFixed(2)+"%"}}
    }}});

  const cols=[["n","Campa\u00f1a"],["sp","Gasto"],["va","Valor conv."],["roas","ROAS"],["cvr","Conv."],["cpa","CPA"],["ticket","Ticket"],["ctr","CTR"],["cpc","CPC"],["pu","Compras"]];
  const rows=cur.c.map(x=>{
    const c=CAMPS.get(x.k);
    return {n:c.n,p:c.p,sp:x.sp,va:x.va,pu:x.pu,roas:x.sp?x.va/x.sp:0,cvr:x.cl?x.pu/x.cl*100:0,
            cpa:x.pu?x.sp/x.pu:0,ticket:x.pu?x.va/x.pu:0,ctr:x.im?x.cl/x.im*100:0,cpc:x.cl?x.sp/x.cl:0};
  });
  rows.sort((p,q)=>sortKey==="n"?p.n.localeCompare(q.n):q[sortKey]-p[sortKey]);
  let h='<thead><tr>'+cols.map(k=>'<th data-k="'+k[0]+'">'+k[1]+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(x=>{h+='<tr><td><span class="bdg '+x.p+'">'+(x.p==="meta"?"M":"G")+'</span> '+x.n+'</td><td>'+clp(x.sp)+'</td><td>'+clp(x.va)+'</td><td class="'+(x.roas>=be?"good":"bad")+'">'+x.roas.toFixed(2)+'x</td><td>'+x.cvr.toFixed(3)+'%</td><td>'+(x.cpa?clp(x.cpa):"\u2014")+'</td><td>'+(x.ticket?clp(x.ticket):"\u2014")+'</td><td>'+x.ctr.toFixed(2)+'%</td><td>'+clp(x.cpc)+'</td><td>'+x.pu+'</td></tr>'});
  if(!rows.length)h+='<tr><td colspan="10" style="text-align:center;color:#8a8a84;padding:20px">Sin datos en este rango</td></tr>';
  const tr=document.getElementById("trank");tr.innerHTML=h+'</tbody>';
  tr.querySelectorAll("th").forEach(th=>th.onclick=()=>{sortKey=th.dataset.k;render()});

  let t='<thead><tr><th>'+(cur.unit==="d\u00eda"?"D\u00eda":"Semana")+'</th><th>Gasto</th><th>Valor conv.</th><th>ROAS</th><th>Conv.</th><th>CTR</th><th>CPC</th><th>Compras</th></tr></thead><tbody>';
  cur.b.slice().reverse().forEach(x=>{if(!x.sp&&!x.va)return;const r=x.sp?x.va/x.sp:0;
    t+='<tr><td>'+fmt(x.k)+'</td><td>'+clp(x.sp)+'</td><td>'+clp(x.va)+'</td><td class="'+(r>=be?"good":"bad")+'">'+r.toFixed(2)+'x</td><td>'+(x.cl?(x.pu/x.cl*100).toFixed(3):"0,000")+'%</td><td>'+(x.im?(x.cl/x.im*100).toFixed(2):"0,00")+'%</td><td>'+(x.cl?clp(x.sp/x.cl):"\u2014")+'</td><td>'+x.pu+'</td></tr>'});
  document.getElementById("tdet").innerHTML=t+'</tbody>';

  document.getElementById("pie").innerHTML=
    "GitHub vuelve a leer Meta y Google dos veces al d\u00eda, a las 08:00 y a las 14:00 de Santiago, y publica los datos solo; el bot\u00f3n \u201cActualizar datos\u201d relee lo \u00faltimo publicado, sin cach\u00e9. "+
    "Los rangos que empiezan antes del "+fmt(iso(dstart))+" usan la serie semanal, que agrupa por semanas completas y puede desbordar los bordes del rango. "+
    "Ojo al sumar plataformas: Meta atribuye a 7 d\u00edas clic / 1 d\u00eda visualizaci\u00f3n y Google usa su propio modelo, as\u00ed que una misma venta puede quedar contada en las dos y el valor combinado no cuadra con la venta real de Shopify. "+
    "El d\u00eda en curso viene incompleto: ambas plataformas registran el gasto antes que las conversiones.";
}

(async()=>{
  try{
    const faltan=await load();buildPlats();buildChips();applyPreset();avisos(faltan);
  }catch(e){
    document.getElementById("msg").innerHTML='<div class="err">No se pudieron cargar los datos: '+e.message+'</div>';
  }
})();
</script>
</body>
</html>
